services:
  duckdns:
    image: python:3.13-alpine
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: "${DOMAIN:?Définir DOMAIN, par exemple formation.duckdns.org}"
      DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:?Définir DUCKDNS_TOKEN}"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ./scripts/duckdns_updater.py
        target: /app/duckdns_updater.py
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "-u", "/app/duckdns_updater.py"]

  code-server:
    build:
      context: .
      dockerfile_inline: |
        FROM docker:28.3.3-cli AS docker-cli
        FROM codercom/code-server:4.145.2
        COPY --from=docker-cli /usr/local/bin/docker /usr/local/bin/docker
        COPY --from=docker-cli /usr/local/libexec/docker/cli-plugins/ /usr/local/libexec/docker/cli-plugins/
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "${DOCKER_GID:?Définir DOCKER_GID}"
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --config
      - /home/coder/.config/code-server/config.yaml
      - "${WORKSPACE:-/home/ubuntu/work}"
    volumes:
      - type: bind
        source: "${WORKSPACE:-/home/ubuntu/work}"
        target: "${WORKSPACE:-/home/ubuntu/work}"
        bind:
          create_host_path: false
      - type: bind
        source: "${CODE_SERVER_CONFIG:-/home/ubuntu/.config/code-server/config.yaml}"
        target: /home/coder/.config/code-server/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /home/coder/.local/share/code-server
        bind:
          create_host_path: false
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:2.11.9-builder AS builder
        RUN xcaddy build v2.11.9 --with github.com/caddy-dns/duckdns
        FROM caddy:2.11.9
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?Définir DOMAIN, par exemple formation.duckdns.org}"
      DUCKDNS_TOKEN: "${DUCKDNS_TOKEN:?Définir DUCKDNS_TOKEN}"
    ports:
      - "444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
